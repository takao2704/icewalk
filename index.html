<style>
*{box-sizing:border-box}body{margin:0;background:#101e2f;color:#ecf8ff;font:16px system-ui,sans-serif}.game{max-width:1100px;height:100svh;min-height:440px;margin:auto;display:flex;flex-direction:column;padding:clamp(12px,3vw,32px);gap:12px}header,.stats,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:clamp(25px,5vw,56px);font-style:italic;letter-spacing:-.065em;line-height:1}small{color:#b2cbdb;font-size:13px}button{font:inherit;color:inherit;border:1px solid #477080;border-radius:12px;padding:9px 14px;background:#20394b;cursor:pointer}button:focus-visible{outline:3px solid #ffbe6e}.stats{font-variant-numeric:tabular-nums}.stats b{display:block;font-size:1.4rem}.track{height:5px;background:#33485b;border-radius:10px;overflow:hidden}.track i{display:block;width:0;height:100%;background:#ffc67e}.stage{position:relative;flex:1;min-height:200px;border-radius:20px;overflow:hidden;background:#244760}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.surface{position:absolute;top:12px;left:12px;border-radius:20px;padding:6px 12px;background:#12273ce8;font-weight:bold;pointer-events:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:#0a1a2a88;padding:15px}.overlay[hidden]{display:none}.overlay strong{font-size:clamp(25px,7vw,58px)}.overlay button{background:#ffd092;color:#192937;border:0;font-weight:800}.overlay p{margin:6px 0 16px}footer p{margin:0;font-size:14px;line-height:1.45}.meter{min-width:92px;text-align:center}.rail{width:92px;height:10px;background:linear-gradient(90deg,#f88a7b,#375369 30%,#70decf 50%,#375369 70%,#f88a7b);position:relative;border-radius:30px;margin-top:5px}.rail i{position:absolute;top:-3px;left:50%;width:4px;height:16px;background:white;border-radius:5px;transform:translateX(-50%)}

</style></head><body><main class="game">
<header><div><h1>ICEWALK</h1><small>凍結路横断選手権 · 富良野</small></div><button id="reset">リセット</button></header>
<div class="stats"><div><small>タイム</small><b id="time">0.00</b></div><div><small>ベスト</small><b id="best">—</b></div><div><small>転倒</small><b id="falls">0</b></div></div>
<div class="track" role="progressbar" aria-label="コース進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div>
<div class="stage"><canvas id="scene" aria-label="人物をつかんで歩くコース"></canvas><div id="surface" class="surface">雪道</div><div id="landmark" class="landmark">コンシェルジュフラノ</div><div id="overlay" class="overlay"><strong id="headline">凍った道を渡るだけ。</strong><p id="description">夜明け前の富良野。ゴールは青い橋。</p><p id="detail" class="detail" hidden></p><div class="result-actions"><button id="start">コースに出る</button><a id="report-x" class="report-link" target="_blank" rel="noopener noreferrer" hidden>Xで報告</a><button id="share" class="share" hidden>歩行記録を送る</button></div><p id="share-status" class="share-status" role="status" hidden></p></div></div>
<footer><p><b>人物の胸をつかんで右上へ。</b><br>傾いたら、指を反対側へ少し戻す。</p><div class="meter"><small>バランス</small><div class="rail"><i id="balance"></i></div></div></footer>
</main><script>
const byId = id => document.getElementById(id);
const canvas = byId('scene'), ctx = canvas.getContext('2d');
const ice = [[310,590],[850,1180],[1410,1870],[2090,2470]];
const finish = 2700, clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const onIce = x => ice.some(([a,b]) => x >= a && x < b);
const keys = new Set();
let width,height,ground,scale,camera,x,v,lean,spin,step,falls,recovery,elapsed,mode,pointer,cursor,last,clockStart;
const minimumGlideSpeed = 58;
const glideEntryWindow = .18;
let glideWindow, gliding;
let best = null;
try {
  const savedTime = Number(localStorage.getItem('icewalk-best-v1'));
  if (Number.isFinite(savedTime) && savedTime > 0) best = savedTime;
} catch {}
const format = t => t.toFixed(2) + ' s';
function roadState() {
  if (recovery > 0) return 'fall';
  if (!onIce(x)) return 'snow';
  if (gliding) return 'glide';
  return Math.abs(lean) >= .48 ? 'warning' : 'ice';
}
function reset(modeAfter='ready') {
  x=65; v=0; lean=0; spin=0; step=0; falls=0; recovery=0; elapsed=0; mode=modeAfter; pointer=null; cursor=null; keys.clear();
  glideWindow=0; gliding=false;
  byId('overlay').hidden = modeAfter === 'ready';
}
function resize() {
  const box = canvas.getBoundingClientRect(), density = Math.min(2,devicePixelRatio || 1);
  width=box.width; height=box.height;
  canvas.width=Math.round(width*density); canvas.height=Math.round(height*density);
  ctx.setTransform(density,0,0,density,0,0);
  ground=height*.76; scale=clamp(height/450,.7,1.3);
}
function begin(now) { if(mode==='ready'){mode='running';clockStart=now;} }
function update(dt,now) {
  if(mode!=='running') return;
  elapsed=(now-clockStart)/1000;
  if(recovery>0){
    recovery=Math.max(0,recovery-dt);
    if(recovery===0){lean=0;spin=0;}
    return;
  }
  const icy=onIce(x);
  const anchor=avatarX(), chest=ground-60*scale;
  const pull=cursor ? clamp((chest-cursor.y)/(52*scale),0,1) : keys.has('ArrowUp') ? .67 : 0;
  const steer=cursor ? clamp((cursor.x-anchor)/(48*scale),-1,1) :
    Number(keys.has('ArrowRight'))*.43-Number(keys.has('ArrowLeft'))*.55;
  const holding=Boolean(cursor)||keys.size>0;
  const drive=pull*(.72+.28*steer)+(cursor? Math.max(0,steer)*.26 : 0);
  const acceleration=holding?(185*drive):0;
  const neutral=pull<=.14 && Math.abs(steer)<=.16;
  if (gliding && !neutral) gliding=false;
  if (icy && glideWindow>0) {
    glideWindow=Math.max(0,glideWindow-dt);
    if (neutral && Math.abs(lean)<=.18 && Math.abs(spin)<=.65) {
      gliding=true;
      glideWindow=0;
    }
  }
  if (!gliding) v=clamp(v+(acceleration-v*(icy? .87:2.45))*dt,0,145);
  const instability=icy ? Math.max(0,(v-46)/76) : 0;
  const ripple=Math.sin(x*.048)*.55 + Math.sin(x*.021)*.35;
  const torque=gliding ? steer*.8+ripple*.16 : icy ? .19+instability*(2.05+ripple)+steer*3.45 : steer*.95;
  spin+=(torque+lean*(gliding? -5 : icy? -2.3+instability*3.2:-12)-spin*(gliding? 4.5 : icy? 3.1:7.5))*dt;
  lean=clamp(lean+spin*dt,-1.4,1.4);
  x=Math.min(finish,x+v*dt);
  if (!gliding) step+=v*dt*.07;
  const nextIcy=onIce(x);
  if (!icy && nextIcy && v>=minimumGlideSpeed) glideWindow=glideEntryWindow;
  if (!nextIcy) { gliding=false; glideWindow=0; }
  if(icy && Math.abs(lean)>.77) {
    gliding=false; glideWindow=0;
    falls++; recovery=1.35; v=0; pointer=null;cursor=null;
    if(navigator.vibrate) navigator.vibrate(55);
  }
  if(x>=finish){
    mode='finished';pointer=null;cursor=null;
    const previousBest=best;
    const record=previousBest===null || elapsed<previousBest;
    const gap=previousBest===null ? '初完走' :
      record ? '前回ベストを '+format(previousBest-elapsed)+' 更新' :
      elapsed===previousBest ? '自己ベストと同タイム' : '自己ベストより '+format(elapsed-previousBest)+' 遅い';
    if(record){best=elapsed;try{localStorage.setItem('icewalk-best-v1',String(best));}catch{}}
    show(previousBest===null || !record ? '青い橋に到着' : '自己ベスト更新',format(elapsed),'もう一度',gap+' ／ '+fallReport(falls));
  }
}
function avatarX(){return x*scale-Math.max(0,x*scale-width*.32);}
function fallReport(count) {
  return count === 0 ? '無傷で青い橋に到着' : '転倒 '+count+' 回。なんとか青い橋に到着';
}
function resultText(time, count) {
  return '【凍結路横断選手権・富良野】'+format(time)+' ／ '+fallReport(count);
}
function reportUrl(time,count,gameUrl) {
  const intent=new URL('https://x.com/intent/tweet');
  intent.searchParams.set('text','富良野の凍った道を渡りました。'+format(time)+' ／ 転倒 '+count+' 回');
  intent.searchParams.set('url',gameUrl);
  return intent.href;
}
function show(title,description,label,detail=''){
  byId('headline').textContent=title;byId('description').textContent=description;
  byId('description').classList.toggle('result', Boolean(detail));
  byId('detail').hidden=!detail;
  byId('detail').textContent=detail;
  const report=byId('report-x');
  report.hidden=mode!=='finished';
  if(!report.hidden){
    report.href=reportUrl(elapsed,falls,new URL(location.pathname,location.origin).href);
  }else{
    report.removeAttribute('href');
  }
  byId('share').hidden=mode!=='finished';
  byId('share-status').hidden=true;
  byId('share-status').textContent='';
  byId('start').textContent=label;byId('overlay').hidden=false;
}
function line(x1,y1,x2,y2,color,w){
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function fill(color,x,y,w,h){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
function disk(color,x,y,r){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function blend(from,to,amount){
  return 'rgb('+from.map((value,i)=>Math.round(value+(to[i]-value)*amount)).join(',')+')';
}
function silhouette(color,points){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for(const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath();
  ctx.fill();
}
function drawFurano(dawn){
  const sky=ctx.createLinearGradient(0,0,0,ground);
  sky.addColorStop(0,blend([12,29,79],[108,159,196],dawn));
  sky.addColorStop(.55,blend([37,93,165],[176,202,219],dawn));
  sky.addColorStop(1,blend([136,173,208],[255,199,150],dawn));
  fill(sky,0,0,width,ground+1);
  const sunX=width*.8, sunY=ground*(.72-dawn*.24);
  const glow=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,ground*.62);
  glow.addColorStop(0,'rgba(255,194,117,'+dawn*.48+')');
  glow.addColorStop(1,'rgba(255,194,117,0)');
  fill(glow,0,0,width,ground);
  if(dawn>.57){
    ctx.globalAlpha=(dawn-.57)/.43;
    disk('#fff0c5',sunX,sunY,15*scale);
    ctx.globalAlpha=1;
  }

  // Distant snowy ski slopes stay visible above the low town buildings.
  const ridgeY=ground*.68;
  const mountain=blend([37,53,91],[90,94,116],dawn);
  const snow=blend([94,114,164],[255,203,146],dawn);
  const span=408*scale;
  const offset=camera*.19;
  for(let i=Math.floor(offset/span)-1;i<=(offset+width)/span;i++){
    const left=i*span-offset;
    const peak=(u,v)=>[left+u*scale,ridgeY+v*ground];
    silhouette(mountain,[peak(0,.21),peak(55,-.02),peak(116,-.17),peak(166,-.10),peak(230,-.30),peak(286,-.24),peak(340,-.15),peak(408,.21),peak(408,.34),peak(0,.34)]);
    silhouette(snow,[peak(59,-.03),peak(116,-.17),peak(166,-.10),peak(145,-.085),peak(129,-.12),peak(118,-.04),peak(106,-.115)]);
    silhouette(snow,[peak(170,-.11),peak(230,-.30),peak(286,-.24),peak(340,-.15),peak(302,-.166),peak(280,-.205),peak(269,-.12),peak(294,-.04),peak(314,-.01),peak(282,-.022),peak(249,-.124),peak(237,-.241),peak(215,-.184),peak(203,-.099),peak(192,-.142)]);
  }

}
function drawTown(dawn){
  const lot=116*scale;
  const townOffset=camera*.72;
  for(let i=Math.floor(townOffset/lot)-1;i<=(townOffset+width)/lot;i++){
    if(i<0||i*116>1550) continue;
    const left=i*lot-townOffset;
    const roof=ground-(49+(i*29)%57)*scale, buildingWidth=(76+(i*13)%30)*scale;
    fill(blend([21,30,53],[112,106,112],dawn),left,roof,buildingWidth,ground-roof);
    if(i%3===1){
      silhouette('#d2dde9',[[left-5*scale,roof],[left+buildingWidth*.46,roof-23*scale],[left+buildingWidth+5*scale,roof]]);
    }else fill('#aebcd2',left-3*scale,roof-5*scale,buildingWidth+6*scale,5*scale);
    for(let j=0;j<3;j++){
      fill((i+j)%3===0 ? blend([255,196,110],[157,130,106],dawn) : '#35465c',left+(12+j*21)*scale,roof+14*scale,12*scale,16*scale);
    }
    if(i%3===0){
      const pole=left+buildingWidth+8*scale, top=ground-133*scale;
      line(pole,ground,pole,top,'#27344c',3*scale);
      line(pole,top+5*scale,pole+14*scale,top+5*scale,'#27344c',2*scale);
      disk(blend([255,187,89],[197,181,164],dawn),pole+14*scale,top+7*scale,3*scale);
      ctx.beginPath();
      ctx.moveTo(pole,top+15*scale);
      ctx.quadraticCurveTo(pole+lot*1.5,top+50*scale,pole+lot*3,top+15*scale);
      ctx.strokeStyle='#27344c9c';ctx.lineWidth=1;ctx.stroke();
    }
  }
}
const landmarks=[
  [105,'コンシェルジュフラノ','concierge'],
  [365,'遠くのスキー場','ski'],
  [630,'へそ踊り像','statue'],
  [900,'軒下のへそ踊り人形','doll'],
  [1170,'みよしの','shop'],
  [1440,'へそビル','heso'],
  [1720,'木造の建物','timber'],
  [2050,'朝日に染まる雪山','sunrise'],
  [2480,'青い橋の入口','statue'],
  [2700,'青い橋','bridge']
];
function landmarkText(text,x,y,color,size){
  ctx.fillStyle=color;
  ctx.font='700 '+size+'px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(text,x,y);
}
function landmarkFigure(x,y,painted){
  fill('#646678',x-26,y-8,52,9);
  line(x-10,y-11,x-15,y-32,'#655b60',9);
  line(x+10,y-11,x+15,y-32,'#655b60',9);
  line(x-27,y-35,x+27,y-35,painted?'#2b9bcd':'#817680',9);
  disk(painted?'#2b9bcd':'#807581',x,y-30,19);
  disk(painted?'#f7d6a8':'#a49a96',x,y-31,13);
  disk('#352b36',x-5,y-34,2);
  disk('#352b36',x+5,y-34,2);
  line(x-3,y-27,x+3,y-27,'#352b36',2);
  silhouette(painted?'#bc5556':'#766b72',[[x-29,y-47],[x,y-66],[x+29,y-47]]);
  fill(painted?'#48a9d2':'#9b8886',x-27,y-47,54,5);
}
function drawLandmarks(dawn, mountains){
  for(const [distance,,kind] of landmarks){
    const isMountain=kind==='ski'||kind==='sunrise';
    if(isMountain!==mountains) continue;
    const screenX=distance*scale-camera;
    if(screenX < -180*scale || screenX > width+180*scale) continue;
    ctx.save();
    ctx.translate(screenX,ground);
    ctx.scale(scale,scale);
    if(isMountain){
      const horizon=-Math.min(118,ground*.42/scale);
      const sunny=kind==='sunrise';
      silhouette(sunny?'#806b73':'#4c5f88',[[-160,-35],[-113,horizon+21],[-65,horizon+10],[-25,horizon-44],[15,horizon-28],[55,horizon-37],[103,horizon-6],[159,-35]]);
      const snow=blend([177,197,222],[255,210,149],sunny?dawn:0);
      silhouette(snow,[[-65,horizon+10],[-25,horizon-44],[15,horizon-28],[55,horizon-37],[103,horizon-6],[75,horizon-13],[56,horizon-24],[31,horizon-11],[14,horizon-19],[-18,horizon-34],[-45,horizon+4]]);
      if(!sunny){
        silhouette('#c5dbeb',[[-24,horizon-35],[-16,horizon-31],[-7,horizon-5],[13,horizon+8],[23,horizon+30],[12,horizon+30],[4,horizon+14],[-18,horizon+1]]);
        silhouette('#9dbce0',[[55,horizon-27],[60,horizon-25],[60,horizon-1],[76,horizon+17],[68,horizon+18],[54,horizon+4]]);
      }
    }else if(kind==='statue') landmarkFigure(0,-2,false);
    else if(kind==='doll'){
      fill('#5d4037',-51,-93,102,93);
      fill('#ae8045',-45,-81,90,81);
      silhouette('#f0e9df',[[-59,-84],[-40,-105],[52,-105],[58,-84]]);
      landmarkFigure(8,-7,true);
    }else if(kind==='shop'){
      fill('#95877c',-70,-105,140,105);
      fill('#222f42',-60,-90,48,25);
      fill('#222f42',2,-90,48,25);
      fill('#fff1dc',-72,-63,144,31);
      fill('#ad454e',-72,-35,144,4);
      landmarkText('みよしの',0,-41,'#243d8a',23);
      fill('#483a39',-40,-29,60,29);
    }else if(kind==='timber'){
      fill('#754c39',-73,-75,146,75);
      for(let plank=-68;plank<72;plank+=13) line(plank,-73,plank,0,'#58392f',2);
      silhouette('#583d3a',[[-83,-71],[-24,-133],[61,-111],[83,-71]]);
      line(-84,-73,-24,-134,'#e9e8e3',5);
      line(-24,-134,62,-112,'#e9e8e3',5);
      fill('#344753',-54,-53,28,34);
      fill('#987058',24,-56,32,56);
      line(14,-73,14,-2,'#55362e',4);
    }else if(kind==='concierge'||kind==='heso'){
      const concierge=kind==='concierge';
      fill(concierge?'#343745':'#51566c',-54,-125,108,125);
      for(let row=0;row<3;row++) fill('#253144',-46,-112+row*23,64,10);
      fill(concierge?'#1b263a':'#f3e8cf',24,-122,24,108);
      const sign=concierge?'フラノ':'へそビル';
      [...sign].forEach((letter,index)=>landmarkText(letter,36,-100+index*19,concierge?'#fff5da':'#302f52',15));
      if(concierge) landmarkText('CONCIERGE',-11,-18,'#f5ddac',10);
    }
    ctx.restore();
  }
}
function drawBlueBridge(){
  const left=(finish-220)*scale-camera, span=300*scale;
  if(left>width||left+span<0) return;
  const archHeight=112*scale;
  for(let i=0;i<=10;i++){
    const t=i/10, post=left+span*t;
    const top=ground-4*t*(1-t)*archHeight;
    line(post,ground,post,top,'#e1ebef',3*scale);
  }
  ctx.beginPath();
  ctx.moveTo(left,ground);
  ctx.quadraticCurveTo(left+span/2,ground-2*archHeight,left+span,ground);
  ctx.strokeStyle='#2454a0';ctx.lineWidth=14*scale;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(left,ground-5*scale);
  ctx.quadraticCurveTo(left+span/2,ground-2*archHeight-5*scale,left+span,ground-5*scale);
  ctx.strokeStyle='#e3eff6';ctx.lineWidth=3*scale;ctx.stroke();
  line(left,ground-21*scale,left+span,ground-21*scale,'#edf2f5',4*scale);
  line(left,ground,left+span,ground,'#2f61a3',8*scale);
}
function draw(){
  camera=Math.max(0,x*scale-width*.32);
  const progress=clamp((x-65)/(finish-65),0,1);
  const dawn=progress*progress*(3-2*progress);
  drawFurano(dawn);
  drawLandmarks(dawn,true);
  drawTown(dawn);
  drawBlueBridge();
  drawLandmarks(dawn,false);
  fill(blend([137,159,192],[202,217,225],dawn),0,ground,width,height-ground);
  fill(blend([189,209,228],[249,247,237],dawn),0,ground,width,7*scale);
  for(const [a,b] of ice){
    const left=a*scale-camera,right=b*scale-camera;
    if(right<0||left>width)continue;
    fill('#629fb3',left,ground,right-left,height-ground);
    fill('#a4e8f0',left,ground,right-left,7*scale);
    for(let p=a+21;p<b-15;p+=37){
      const q=p*scale-camera;
      line(q,ground+17*scale,q+15*scale,ground+10*scale,'#b4eaf2',1.6);
      line(q+5*scale,ground+36*scale,q+19*scale,ground+28*scale,'#82c1d0',1);
    }
  }
  const flag=finish*scale-camera;
  if(flag>-55&&flag<width+55){
    line(flag,ground,flag,ground-94*scale,'#182e41',4);
    for(let row=0;row<3;row++)for(let col=0;col<5;col++) fill((row+col)%2?'#1c3245':'#f4fbff',flag+col*8*scale,ground+(row*8-94)*scale,8*scale,8*scale);
  }
  for(let p=Math.floor(camera/105)*105;p<camera+width;p+=105){
    const px=p-camera;
    if(!onIce(p/scale))line(px,ground+24,px+15,ground+24,'#aac6d0',2);
  }
  const ax=avatarX();
  const state=roadState();
  if (state==='warning' || state==='glide' || (state==='ice' && v>55)) {
    const strength=clamp(v/145,0,1);
    const direction=gliding ? 1 : Math.sign(lean+spin*.18)||1;
    for(let i=0;i<6;i++){
      const phase=(x*.044+i/6)%1;
      const spread=(11+phase*35)*scale;
      const opacity=(1-phase)*(.28+strength*.45);
      line(ax-direction*spread,ground-4-phase*10*scale,
        ax-direction*(spread+6*scale),ground-3-phase*7*scale,
        'rgba(204,247,255,'+opacity+')',1.6*scale);
    }
  }
  ctx.save();ctx.translate(ax,ground);ctx.scale(scale,scale);
  ctx.fillStyle='#203e5455';ctx.beginPath();ctx.ellipse(0,2,24,5,0,0,Math.PI*2);ctx.fill();
  ctx.rotate(recovery>0 ? Math.sign(lean)*Math.min(1.45,(1.35-recovery)*7+.77) : lean*.9);
  for(const side of [-1,1]){
    const swing=gliding ? 4*side : Math.sin(step)*14*side;
    const foot=side*6+swing, lift=gliding ? 0 : Math.max(0,Math.cos(step)*side)*Math.min(7,v*.13);
    line(side*5,-28,foot,-5-lift,'#203042',8);line(foot-2,-4-lift,foot+6,-4-lift,'#13263a',6);
    line(side*5,-49,side*(14+Math.abs(lean)*10),-34+side*lean*8,'#ec713a',7);
  }
  line(0,-30,0,-52,'#fc8b4b',22);
  line(-7,-52,7,-52,'#ffc86e',5);
  disk('#ffcca8',0,-63,10);
  disk('#234455',4,-64,1.3);
  line(-9,-69,8,-69,'#157e82',7);disk('#27a1a0',-2,-74,6);
  ctx.restore();
  if(cursor){
    line(ax+Math.sin(lean*.9)*55*scale,ground-56*scale,cursor.x,cursor.y,'#ffdbad',2);
    disk(state==='warning'?'#ffae76':'#fff1d3a8',cursor.x,cursor.y,7);
    if(state==='warning'){
      // Screen-space cue points to the side that counteracts the lean.
      const direction=-Math.sign(lean);
      const tip=ax+direction*36*scale, y=ground-88*scale;
      line(tip-direction*18*scale,y,tip,y,'#ffd098',2.5);
      line(tip-direction*6*scale,y-5*scale,tip,y,'#ffd098',2.5);
      line(tip-direction*6*scale,y+5*scale,tip,y,'#ffd098',2.5);
    }
  } else if(mode==='ready'){
    ctx.strokeStyle='#ffce91';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ax,ground-56*scale,23*scale+Math.sin(performance.now()/230)*3,0,7);ctx.stroke();
  }
}
const surfaceLabels={glide:'滑走中',snow:'雪道',ice:'氷の上',warning:'氷の上 · バランス注意',fall:'転倒 · 起き上がり中'};
let displayedState, displayedLandmark;
function frame(now){
  update(Math.min(.04,(now-last)/1000||0),now);last=now;draw();
  byId('time').textContent=format(elapsed);byId('best').textContent=best===null?'—':format(best);
  byId('falls').textContent=falls;
  const state=roadState();
  if(state!==displayedState){
    byId('surface').textContent=surfaceLabels[state];
    byId('surface').dataset.state=state;
    byId('balance').parentElement.dataset.state=state;
    displayedState=state;
  }
  const landmark=landmarks.findLast(([distance])=>x>=distance-65)??landmarks[0];
  if(landmark!==displayedLandmark){
    byId('landmark').textContent=landmark[1];
    displayedLandmark=landmark;
  }
  const pct=Math.round((x-65)/(finish-65)*100);
  byId('progress').style.width=pct+'%';byId('progress').parentElement.setAttribute('aria-valuenow',pct);
  byId('balance').style.left=clamp(50+lean*58,2,98)+'%';
  requestAnimationFrame(frame);
}
function point(event){const box=canvas.getBoundingClientRect();return {x:event.clientX-box.left,y:event.clientY-box.top};}
canvas.addEventListener('pointerdown',event=>{
  if(pointer!==null||recovery>0||!['ready','running'].includes(mode))return;
  const p=point(event);
  if(Math.abs(p.x-avatarX())>47*scale||p.y<ground-105*scale||p.y>ground+20*scale)return;
  event.preventDefault();canvas.setPointerCapture(event.pointerId);pointer=event.pointerId;cursor=p;begin(performance.now());
});
canvas.addEventListener('pointermove',event=>{if(pointer===event.pointerId)cursor=point(event);});
for(const name of ['pointerup','pointercancel','lostpointercapture']){
  canvas.addEventListener(name,event=>{if(pointer===event.pointerId){pointer=null;cursor=null;}});
}
addEventListener('keydown',event=>{
  if(!['ArrowUp','ArrowLeft','ArrowRight'].includes(event.key)||!['ready','running'].includes(mode))return;
  event.preventDefault();keys.add(event.key);begin(performance.now());
});
addEventListener('keyup',event=>keys.delete(event.key));
addEventListener('blur',()=>{keys.clear();pointer=null;cursor=null;});
byId('start').onclick=()=>reset();
byId('share').onclick=async()=>{
  if (mode!=='finished') return;
  const text=resultText(elapsed,falls);
  const url=new URL(location.pathname,location.origin).href;
  const status=byId('share-status');
  try {
    if (navigator.share) {
      try {
        await navigator.share({title:'凍結路横断選手権',text,url});
        return;
      } catch (error) {
        if (error.name==='AbortError') return;
      }
    }
    await navigator.clipboard.writeText(text+'\n'+url);
    if (mode==='finished') {
      status.textContent='歩行記録とリンクをコピーしました';
      status.hidden=false;
    }
  } catch {
    if (mode==='finished') {
      status.textContent='共有できませんでした。もう一度お試しください。';
      status.hidden=false;
    }
  }
};
byId('reset').onclick=()=>{reset('intro');show('凍った道を渡るだけ。','夜明け前の富良野。ゴールは青い橋。','コースに出る');};
new ResizeObserver(resize).observe(canvas);resize();reset('intro');requestAnimationFrame(frame);
</script></body></html>
